plugins {
    id 'com.android.application'
}

android {
    namespace 'it.sculptura.jarvis'
    compileSdk 36

    defaultConfig {
        applicationId 'it.sculptura.jarvis'
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
